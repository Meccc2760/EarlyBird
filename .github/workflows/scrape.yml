name: Earlybird Reminder

permissions:
  contents: read

on:
  schedule:
    # Beijing time: 06:55, 12:55, and 17:55 every day.
    - cron: '55 6,12,17 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch: {}

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GRADESCOPE_EMAIL: ${{ secrets.GRADESCOPE_EMAIL }}
          GRADESCOPE_PASSWORD: ${{ secrets.GRADESCOPE_PASSWORD }}
          MAIL_SEND: ${{ secrets.MAIL_SEND }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          MAIL_RECEIVE: ${{ secrets.MAIL_RECEIVE }}
        run: python reminder.py
